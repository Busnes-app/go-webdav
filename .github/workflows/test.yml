name: test
on:
  push:
    branches: [kycalendar]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go vet -composites=false ./...
      - run: go test -race -count=1 ./...
