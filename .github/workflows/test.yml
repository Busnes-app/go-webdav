name: test
on:
  push:
    branches: [kycalendar]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6" # match KyCalendar; go.mod says 1.13
      - run: go vet -composites=false ./...
      - run: go test -race -count=1 ./...
